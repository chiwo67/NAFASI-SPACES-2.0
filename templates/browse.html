<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/spaces.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="../scripts/store.js" defer></script>
    <script src="../scripts/browse.js" defer></script>
    <title>Browse spaces | Nafasi</title>
  </head>

  <body>
    <header id="h-button" class="border-b border-amber-200 bg-[#fff8ef] text-slate-800">
      <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-3 px-5 py-4 sm:flex-row">
        <a href="display.html" class="text-xl font-extrabold tracking-[0.22em]">NAFASI</a>
        <nav aria-label="Main navigation" class="flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-sm font-semibold sm:text-base">
          <a href="display.html" class="transition hover:text-amber-700">Home</a>
          <a href="spaces.html" aria-current="page" class="text-amber-700">Spaces</a>
          <a href="about.html" class="transition hover:text-amber-700">About</a>
          <a href="support.html" class="transition hover:text-amber-700">Support</a>
        </nav>
        <label for="category-filter" class="sr-only">Filter spaces by category</label>
        <select id="category-filter" class="border border-black rounded px-2 py-1">
          <option value="all">All spaces</option>
          <option value="Leisure">Leisure</option>
          <option value="Workspace">Workspace</option>
          <option value="Events">Events</option>
        </select>
      </div>
    </header>

    <main class="px-3 pb-8">
      <p id="spaces-status" class="text-center font-semibold mt-5" role="status">Loading spaces...</p>
      <div id="spaces-list" hidden></div>
    </main>
  </body>
</html>
