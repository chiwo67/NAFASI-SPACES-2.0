<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Nafasi Spaces</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="border-b border-amber-200 bg-[#fff8ef] text-slate-800">
      <div class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-3 px-5 py-4 sm:flex-row">
        <a href="../index.html" class="text-xl font-extrabold tracking-[0.22em]">NAFASI</a>
        <nav aria-label="Main navigation" class="flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-sm font-semibold sm:text-base">
          <a href="../index.html" class="transition hover:text-amber-700">Home</a>
          <a href="spaces.html" class="transition hover:text-amber-700">Spaces</a>
          <a href="about.html" class="transition hover:text-amber-700">About</a>
          <a href="support.html" class="transition hover:text-amber-700">Support</a>
        </nav>
      </div>
    </header>
    <section class="flex min-h-[calc(100vh-73px)] items-center justify-center bg-amber-50 px-4 py-8">
      <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl sm:p-8">
        <form class="space-y-4 text-slate-800" id="create-account-form">
          <h1 class="text-2xl font-semibold text-slate-900">Create New Account</h1>
          <p class="text-sm text-slate-500">Join Nafasi Spaces and get started.</p>

          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="first-name" class="mb-2 block text-sm font-medium text-slate-700">First Name</label>
              <input type="text" id="first-name" name="first-name" placeholder="First name" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200" />
            </div>
            <div>
              <label for="last-name" class="mb-2 block text-sm font-medium text-slate-700">Last Name</label>
              <input type="text" id="last-name" name="last-name" placeholder="Last name" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200" />
            </div>
          </div>

          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200" />
          </div>

          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200" />
          </div>

          <div>
            <label for="confirm-password" class="mb-2 block text-sm font-medium text-slate-700">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200" />
          </div>

          <div class="flex items-start gap-2">
            <input type="checkbox" id="terms" name="terms" required class="mt-1 h-4 w-4 rounded border-slate-300 text-amber-500 focus:ring-amber-400" />
            <label for="terms" class="text-sm text-slate-600">I agree to the terms and conditions.</label>
          </div>

          <button type="submit" class="w-full rounded-lg bg-amber-500 px-4 py-2.5 font-semibold text-white transition hover:bg-amber-600" onclick="">Create Account</button>

          <p class="text-center text-sm text-slate-600">
            Already have an account?
            <a href="login.html" class="font-medium text-blue-600 hover:text-blue-700">Log in</a>
          </p>
          <p id="create-account-error" class="text-red-500 text-center"></p>
        </form>
      </div>
    </section>
    <script src="../scripts/store.js"></script>
    <script src="../scripts/new-acc.js"></script>
  </body>
</html>
